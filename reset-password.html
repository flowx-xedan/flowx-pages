<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعيين كلمة مرور جديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F172A;
    --ink-light: #1E293B;
    --gold: #B8862F;
    --gold-light: #E8B94A;
    --danger: #B3261E;
    --success: #1B8A5A;
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --text: #0F172A;
    --text-muted: #5B6472;
    --border: #E1DED6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131C;
      --surface: #161B29;
      --text: #E7E9EE;
      --text-muted: #97A0B0;
      --border: #2E3548;
      --gold: #E8B94A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131C;
    --surface: #161B29;
    --text: #E7E9EE;
    --text-muted: #97A0B0;
    --border: #2E3548;
    --gold: #E8B94A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }
  .badge svg { width: 28px; height: 28px; }
  h1 {
    font-size: 19px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 6px;
  }
  p.sub {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin: 0 0 26px;
    line-height: 1.7;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-muted);
  }
  .field { margin-bottom: 16px; }
  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    direction: ltr;
    text-align: left;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 28px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) button { background: var(--gold); color: var(--ink); }
  }
  :root[data-theme="dark"] button { background: var(--gold); color: var(--ink); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.7;
    display: none;
  }
  .msg.show { display: block; }
  .msg.error { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .msg.success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
  .state { text-align: center; font-size: 13px; color: var(--text-muted); padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4z" fill="#fff" opacity="0.95"/>
        <path d="M9 12l2 2 4-4" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub" id="subtitle">جاري التحقق من الرابط...</p>

    <div id="loadingState" class="state">لحظات من فضلك...</div>

    <form id="resetForm" style="display:none">
      <div class="field">
        <label for="pw1">كلمة المرور الجديدة</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="6 أحرف على الأقل" />
      </div>
      <div class="field">
        <label for="pw2">تأكيد كلمة المرور</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="اكتبها تاني" />
      </div>
      <button type="submit" id="submitBtn">حفظ كلمة المرور</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://kcypuwtbnoeatqrrvyqy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeXB1d3Ribm9lYXRxcnJ2eXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTc2MjUsImV4cCI6MjEwNDczMzYyNX0.z8Eu-hqzv-56Z5UrJ3XLdoyAJaV9U9smAHahp72sBD4';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const subtitle = document.getElementById('subtitle');
    const loadingState = document.getElementById('loadingState');
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg show ' + type;
    }

    let sessionReady = false;

    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        sessionReady = true;
        loadingState.style.display = 'none';
        form.style.display = 'block';
        subtitle.textContent = 'اكتب كلمة المرور الجديدة اللي هتستخدمها بعد كده';
      }
    });

    // لو الرابط قديم أو فاسد ومفيش جلسة اتفتحت خلال ثوان، نوري رسالة واضحة
    setTimeout(() => {
      if (!sessionReady) {
        loadingState.style.display = 'none';
        subtitle.textContent = 'تعذر التحقق من الرابط';
        showMsg('الرابط منتهي الصلاحية أو استُخدم قبل كده. ارجع لشاشة الدخول في التطبيق واطلب رابط جديد.', 'error');
      }
    }, 4000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;

      if (pw1.length < 6) {
        showMsg('كلمة المرور لازم تكون 6 أحرف على الأقل.', 'error');
        return;
      }
      if (pw1 !== pw2) {
        showMsg('كلمتا المرور مش متطابقتين.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الحفظ...';
      try {
        const { error } = await client.auth.updateUser({ password: pw1 });
        if (error) throw error;
        form.style.display = 'none';
        subtitle.textContent = 'تم بنجاح';
        showMsg('اتغيّرت كلمة المرور. تقدر تقفل الصفحة دي وتدخل من التطبيق بكلمة المرور الجديدة.', 'success');
      } catch (err) {
        showMsg('حصل خطأ: ' + (err && err.message ? err.message : 'حاول تاني'), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ كلمة المرور';
      }
    });
  </script>
</body>
</html>
