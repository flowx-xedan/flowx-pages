<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>تعيين كلمة مرور جديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F172A;
    --ink-light: #1E293B;
    --gold: #B8862F;
    --gold-light: #E8B94A;
    --danger: #B3261E;
    --success: #1B8A5A;
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --text: #0F172A;
    --text-muted: #5B6472;
    --border: #E1DED6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131C;
      --surface: #161B29;
      --text: #E7E9EE;
      --text-muted: #97A0B0;
      --border: #2E3548;
      --gold: #E8B94A;
      --danger: #F2807A;
      --success: #4CC38A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131C;
    --surface: #161B29;
    --text: #E7E9EE;
    --text-muted: #97A0B0;
    --border: #2E3548;
    --gold: #E8B94A;
    --danger: #F2807A;
    --success: #4CC38A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }
  .badge svg { width: 28px; height: 28px; }
  h1 {
    font-size: 19px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 6px;
  }
  p.sub {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin: 0 0 26px;
    line-height: 1.7;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-muted);
  }
  .field { margin-bottom: 16px; }
  input[type="password"], input[type="text"].pw {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    direction: ltr;
    text-align: left;
  }
  input.pw:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
    border-color: var(--gold);
  }
  .show-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin: -4px 0 14px;
    cursor: pointer;
  }
  .show-row input { width: 16px; height: 16px; accent-color: var(--gold); }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 28px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) button { background: var(--gold); color: var(--ink); }
  }
  :root[data-theme="dark"] button { background: var(--gold); color: var(--ink); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.7;
    display: none;
  }
  .msg.show { display: block; }
  .msg.error { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .msg.success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
  .state { text-align: center; font-size: 13px; color: var(--text-muted); padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2L3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4z" fill="#fff" opacity="0.95"/>
        <path d="M9 12l2 2 4-4" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub" id="subtitle">جاري التحقق من الرابط...</p>

    <div id="loadingState" class="state" role="status">لحظات من فضلك...</div>

    <form id="resetForm" style="display:none" novalidate>
      <div class="field">
        <label for="pw1">كلمة المرور الجديدة</label>
        <input class="pw" type="password" id="pw1" autocomplete="new-password" placeholder="6 أحرف على الأقل" />
      </div>
      <div class="field">
        <label for="pw2">تأكيد كلمة المرور</label>
        <input class="pw" type="password" id="pw2" autocomplete="new-password" placeholder="اكتبها تاني" />
      </div>
      <label class="show-row" for="showPw"><input type="checkbox" id="showPw"> إظهار كلمة المرور</label>
      <button type="submit" id="submitBtn">حفظ كلمة المرور</button>
    </form>

    <div id="msg" class="msg" role="alert"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // ===== إعدادات المشروع: غيّر القيمتين دول بس لكل عميل =====
    // (مفتاح anon عام ومقصود إنه يظهر هنا، الحماية من سياسات RLS في Supabase)
    const SUPABASE_URL = 'https://kcypuwtbnoeatqrrvyqy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeXB1d3Ribm9lYXRxcnJ2eXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTc2MjUsImV4cCI6MjEwNDczMzYyNX0.z8Eu-hqzv-56Z5UrJ3XLdoyAJaV9U9smAHahp72sBD4';
    // =========================================================

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const subtitle = document.getElementById('subtitle');
    const loadingState = document.getElementById('loadingState');
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');
    const pw1El = document.getElementById('pw1');
    const pw2El = document.getElementById('pw2');

    const searchParams = new URLSearchParams(location.search);
    const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
    const isRecoveryUrl = hashParams.get('type') === 'recovery' || searchParams.get('type') === 'recovery';

    let sessionReady = false;
    let failed = false;
    let done = false;

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg show ' + type;
    }

    function fail(title, text) {
      if (sessionReady || done) return;
      failed = true;
      loadingState.style.display = 'none';
      form.style.display = 'none';
      subtitle.textContent = title;
      showMsg(text, 'error');
    }

    // بعد ما الجلسة تتفتح نشيل التوكن من شريط العنوان (عشان مايفضلش ظاهر أو يتحفظ في السجل)
    function cleanUrl() {
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* مش مشكلة */ }
    }

    function becomeReady() {
      if (sessionReady || failed || done) return;
      sessionReady = true;
      loadingState.style.display = 'none';
      form.style.display = 'block';
      msg.className = 'msg';
      subtitle.textContent = 'اكتب كلمة المرور الجديدة اللي هتستخدمها بعد كده';
      cleanUrl();
      pw1El.focus();
    }

    function arabicError(err) {
      const m = String((err && err.message) || '').toLowerCase();
      if (m.includes('different from the old')) return 'كلمة المرور الجديدة لازم تكون مختلفة عن القديمة.';
      if (m.includes('at least')) return 'كلمة المرور قصيرة، لازم 6 أحرف على الأقل.';
      if (m.includes('weak') || m.includes('pwned') || m.includes('easy to guess')) return 'كلمة المرور ضعيفة أو شائعة. جرّب كلمة أطول وأصعب.';
      if (m.includes('session missing') || m.includes('expired') || m.includes('not authenticated')) return 'الجلسة انتهت. ارجع للتطبيق واطلب رابط جديد.';
      if (m.includes('fetch') || m.includes('network')) return 'مفيش اتصال بالإنترنت. اتأكد من النت وحاول تاني.';
      return 'حصل خطأ. حاول تاني، ولو اتكرر اطلب رابط جديد من التطبيق.';
    }

    // 1) الرابط جاي بخطأ جاهز من Supabase (منتهي أو استُخدم قبل كده)
    const urlErrorCode = hashParams.get('error_code') || searchParams.get('error_code');
    const urlError = hashParams.get('error') || searchParams.get('error');

    client.auth.onAuthStateChange((event, session) => {
      // نفتح الفورم بس لو الجلسة جاية من رابط استعادة فعلًا (مش أي دخول عادي في نفس المتصفح)
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session && isRecoveryUrl)) {
        becomeReady();
      }
    });

    if (urlErrorCode || urlError) {
      fail('تعذر التحقق من الرابط',
        urlErrorCode === 'otp_expired'
          ? 'الرابط منتهي الصلاحية أو استُخدم قبل كده. ارجع لشاشة الدخول في التطبيق واطلب رابط جديد.'
          : 'الرابط مش صالح. ارجع لشاشة الدخول في التطبيق واطلب رابط جديد.');
      cleanUrl();
    } else if (searchParams.get('token_hash') && searchParams.get('type') === 'recovery') {
      // 2) رابط بصيغة token_hash (بيشتغل مع أي إعداد دخول، من غير مفتاح مخزّن في التطبيق)
      client.auth.verifyOtp({ token_hash: searchParams.get('token_hash'), type: 'recovery' })
        .then(({ error }) => {
          if (error) fail('تعذر التحقق من الرابط', 'الرابط منتهي الصلاحية أو استُخدم قبل كده. ارجع لشاشة الدخول في التطبيق واطلب رابط جديد.');
          else becomeReady();
        })
        .catch(() => fail('تعذر التحقق من الرابط', 'مفيش اتصال بالإنترنت. اتأكد من النت وحاول تاني.'));
    } else if (searchParams.get('code')) {
      // 3) رابط بصيغة code (PKCE): بيشتغل بس لو اتفتح في نفس المتصفح اللي طلب الاستعادة
      client.auth.exchangeCodeForSession(searchParams.get('code'))
        .then(({ error }) => {
          if (error) fail('الرابط مش متوافق مع الصفحة دي',
            'الرابط اتطلب بطريقة مش بتتفتح من متصفح تاني. اطلب رابط جديد من التطبيق، ولو المشكلة اتكررت بلّغ المطوّر.');
          else becomeReady();
        })
        .catch(() => fail('تعذر التحقق من الرابط', 'مفيش اتصال بالإنترنت. اتأكد من النت وحاول تاني.'));
    }

    // لو مفيش جلسة اتفتحت خلال ثواني (رابط قديم أو فاسد)، نوري رسالة واضحة
    setTimeout(() => {
      if (!sessionReady && !failed) {
        fail('تعذر التحقق من الرابط',
          'الرابط منتهي الصلاحية أو استُخدم قبل كده. ارجع لشاشة الدخول في التطبيق واطلب رابط جديد.');
      }
    }, 8000);

    document.getElementById('showPw').addEventListener('change', (e) => {
      const t = e.target.checked ? 'text' : 'password';
      pw1El.type = t;
      pw2El.type = t;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return;
      const pw1 = pw1El.value;
      const pw2 = pw2El.value;

      if (pw1.length < 6) {
        showMsg('كلمة المرور لازم تكون 6 أحرف على الأقل.', 'error');
        return;
      }
      if (pw1 !== pw2) {
        showMsg('كلمتا المرور مش متطابقتين.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الحفظ...';
      try {
        const { error } = await client.auth.updateUser({ password: pw1 });
        if (error) throw error;
        done = true;
        form.style.display = 'none';
        pw1El.value = '';
        pw2El.value = '';
        subtitle.textContent = 'تم بنجاح';
        showMsg('اتغيّرت كلمة المرور. تقدر تقفل الصفحة دي وتدخل من التطبيق بكلمة المرور الجديدة.', 'success');
        // نقفل الجلسة المؤقتة في المتصفح، عشان تفضل كلمة المرور الجديدة بس هي طريق الدخول
        try { await client.auth.signOut(); } catch (swErr) { /* مش مشكلة */ }
      } catch (err) {
        showMsg(arabicError(err), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ كلمة المرور';
      }
    });
  </script>
</body>
</html>
